<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticias Racing - Estilo Marca</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background:#f5f5f5; color:#111; }
  .resaltado { color:#00AA00; font-weight:bold; }
  .noticia, .partido { background:#ffffff; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); padding:12px; margin-bottom:12px; display:flex; gap:12px; align-items:flex-start; }
  .noticia img { width:120px; height:80px; object-fit:cover; border-radius:6px; }
  header h1 { font-family: "Arial Black", Arial, sans-serif; }
  .marca-n { font-size:2.5rem; color:#006400; display:inline; }
  table { width:100%; border-collapse: collapse; }
  th, td { padding:8px; text-align:left; border-bottom:1px solid #ddd; }
  th { background:#eee; }
  .en-vivo { color:#FF0000; font-weight:bold; animation: blink 1s infinite; }
  @keyframes blink { 0%,50%,100% { opacity:1 } 25%,75% { opacity:0 } }
</style>
</head>
<body class="min-h-screen">

<!-- HEADER -->
<header class="bg-white py-6 shadow">
  <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
    <h1 class="text-gray-800 text-3xl font-bold tracking-tight">
      <span class="marca-n">N</span>oticias Racing
    </h1>
    <div class="text-right text-xs text-gray-600">
      Actualiza automáticamente cada 30s<br>
      <span class="en-vivo">● EN VIVO</span>
    </div>
  </div>
</header>

<div class="max-w-6xl mx-auto px-4 py-8 space-y-12">

  <!-- NOTICIAS -->
  <section>
    <h2 class="text-2xl font-bold mb-4">Últimas noticias</h2>
    <div id="noticias"></div>
  </section>

  <!-- CLASIFICACIÓN -->
  <section>
    <h2 class="text-2xl font-bold mb-4">Clasificación Primera Federación - Grupo 1</h2>
    <table id="clasificacion"></table>
  </section>

  <!-- RESULTADOS EN VIVO -->
  <section>
    <h2 class="text-2xl font-bold mb-4">Marcador en directo y próximos partidos</h2>
    <div id="partidos"></div>
  </section>

</div>

<!-- FOOTER -->
<footer class="bg-white/50 py-6 text-center text-sm text-gray-600">
  <p>Web creada por nosotros • Hala Racing!</p>
</footer>

<script>
// Backend con API JSON de clasificación, partidos y noticias
const BACKEND = "https://tu-proyecto.vercel.app";

async function fetchFootball(){
  try {
    const res = await fetch(`${BACKEND}/api/football`);
    return await res.json();
  } catch(e){
    console.error("Error fetch football:", e);
    return {standings:[], live:[]};
  }
}

async function fetchNews(){
  try {
    const res = await fetch(`${BACKEND}/api/news`);
    return await res.json();
  } catch(e){
    console.error("Error fetch news:", e);
    return [];
  }
}

async function loadAll(){
  const fb = await fetchFootball();
  const news = await fetchNews();

  // Clasificación
  const table = document.getElementById("clasificacion");
  table.innerHTML = "<tr><th>Pos</th><th>Equipo</th><th>Puntos</th></tr>";
  fb.standings.forEach((team,i)=>{
    const clase = /racing/i.test(team.team.name) ? "resaltado" : "";
    table.innerHTML += `<tr class="${clase}"><td>${i+1}</td><td>${team.team.name}</td><td>${team.points}</td></tr>`;
  });

  // Partidos
  const partidosDiv = document.getElementById("partidos");
  partidosDiv.innerHTML = "";
  if(fb.live.length===0){
    partidosDiv.innerText = "No hay partidos en vivo";
  } else {
    fb.live.forEach(game=>{
      const h = game.teams.home.name;
      const a = game.teams.away.name;
      const gh = game.goals.home;
      const ga = game.goals.away;
      const clase = /racing/i.test(h+a) ? "resaltado" : "";
      let icons = '';
      if(game.cards){
        if(game.cards.yellow){
          icons += ` 🟨${game.cards.yellow}`;
        }
        if(game.cards.red){
          icons += ` 🟥${game.cards.red}`;
        }
      }
      partidosDiv.innerHTML += `<div class="partido ${clase}"><i class="fa-solid fa-futbol"></i> ${h} ${gh} - ${ga} ${a}${icons} <span class="en-vivo">●</span></div>`;
    });
  }

  // Noticias
  const noticiasDiv = document.getElementById("noticias");
  noticiasDiv.innerHTML = "";
  news.forEach(n=>{
    const imgSrc = n.image || "https://via.placeholder.com/120x80?text=Racing";
    noticiasDiv.innerHTML += `
      <div class="noticia">
        <img src="${imgSrc}" alt="Noticia">
        <div>
          <a href="${n.link}" target="_blank" class="text-gray-900 font-semibold">${n.title}</a>
          <p class="text-gray-600 text-sm mt-1">${n.source || ""}</p>
        </div>
      </div>`;
  });
}

// Carga inicial y actualización cada 30s
loadAll();
setInterval(loadAll, 30000);
</script>

</body>
</html>
