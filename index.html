<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticias Racing - Estilo All Star</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background:#f5f5f5; color:#111; }
  
  /* HEADER */
  header h1 { font-family: "Impact", "Arial Black", sans-serif; text-transform: uppercase; letter-spacing: -2px; }
  .marca-n { 
    font-size:4.5rem; 
    color:white; 
    -webkit-text-stroke: 3px #004500; /* ribete verde oscuro */ 
    font-weight: 900;
  }
  .marca-resto { 
    font-size:2.8rem; 
    color:white; 
    -webkit-text-stroke: 2px #004500; 
    font-weight: 800;
  }

  /* NOTICIAS */
  .noticia { 
    background:#ffffff; 
    border-radius:8px; 
    box-shadow:0 2px 6px rgba(0,0,0,0.1); 
    padding:12px; 
    margin-bottom:12px; 
    display:flex; 
    gap:16px; 
    align-items:flex-start; 
    transition: transform 0.2s; 
  }
  .noticia:hover { transform: translateY(-2px); }
  .noticia img { width:160px; height:90px; object-fit:cover; border-radius:6px; flex-shrink:0; }

  /* EN VIVO */
  .en-vivo { color:#FF0000; font-weight:bold; animation: blink 1s infinite; }
  @keyframes blink { 0%,50%,100% { opacity:1 } 25%,75% { opacity:0 } }

</style>
</head>
<body class="min-h-screen">

<!-- HEADER -->
<header class="bg-white py-6 shadow">
  <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
    <h1>
      <span class="marca-n">N</span><span class="marca-resto">oticias Racing</span>
    </h1>
  </div>
</header>

<div class="max-w-6xl mx-auto px-4 py-8">

  <!-- NOTICIAS -->
  <section>
    <h2 class="text-2xl font-bold mb-4">Últimas noticias del Racing</h2>
    <div id="noticias">Cargando noticias...</div>
  </section>

</div>

<script>
// RSS que funciona con CORS
const RSS_URL = "https://news.google.com/rss/search?q=%22Racing+de+Ferrol%22+OR+%22Racing+Club+Ferrol%22&hl=es-ES&gl=ES&ceid=ES:es";
const RSS2JSON = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(RSS_URL);

async function loadNews(){
  try {
    const res = await fetch(RSS2JSON);
    const data = await res.json();
    const noticiasDiv = document.getElementById("noticias");
    noticiasDiv.innerHTML = "";
    data.items.forEach(item => {
      const imgSrc = item.enclosure?.link 
                     || item.thumbnail 
                     || "https://via.placeholder.com/160x90?text=Racing";
      noticiasDiv.innerHTML += `
        <div class="noticia">
          <img src="${imgSrc}" alt="Noticia">
          <div>
            <a href="${item.link}" target="_blank" class="text-gray-900 font-semibold">${item.title}</a>
            <p class="text-gray-600 text-sm mt-1">${item.pubDate ? new Date(item.pubDate).toLocaleDateString() : ''}</p>
          </div>
        </div>
      `;
    });
  } catch(e){
    console.error("Error cargando noticias:", e);
    document.getElementById("noticias").innerText = "No se pudieron cargar las noticias.";
  }
}

// Carga inicial y actualización cada 30s
loadNews();
setInterval(loadNews, 30000);
</script>

</body>
</html>
