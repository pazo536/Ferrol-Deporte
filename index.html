<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticias Racing</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  font-family: 'Roboto', Arial, sans-serif;
  background:#f4f4f4;
  margin:0;
  color:#111;
}

/* ===== HEADER ===== */
header {
  background:#f7f7f2;
  padding:28px 16px;
  text-align:center;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}

header h1 {
  font-family:'Oswald','Arial Black',sans-serif;
  text-transform:uppercase;
  margin:0;
}

.marca-n {
  font-size:5rem;
  color:#fff;
  -webkit-text-stroke:3px #0a3b1d;
  font-weight:900;
}

.marca-resto {
  font-size:2.8rem;
  color:#fff;
  -webkit-text-stroke:2px #0a3b1d;
  font-weight:700;
  margin-left:6px;
}

/* ===== TARJETAS ===== */
.tarjeta {
  background:#fff;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  padding:12px;
  display:flex;
  gap:14px;
  align-items:center;
  margin-bottom:12px;
}

.tarjeta img {
  width:70px;
  height:70px;
  object-fit:contain;
  flex-shrink:0;
}

.tarjeta .info {
  flex:1;
}

.tarjeta a {
  font-weight:700;
  color:#111;
  text-decoration:none;
}

.tarjeta p {
  font-size:.85rem;
  color:#555;
}

.destacado {
  border:2px solid #0a3b1d;
}
</style>
</head>

<body>

<header>
  <h1>
    <span class="marca-n">N</span><span class="marca-resto">oticias Racing</span>
  </h1>
</header>

<main class="max-w-6xl mx-auto px-4 py-8 space-y-12">

<!-- NOTICIAS -->
<section>
  <h2 class="text-2xl font-bold mb-4">Últimas noticias</h2>
  <div id="noticias">Cargando noticias…</div>
</section>

<!-- CLASIFICACIÓN -->
<section>
  <h2 class="text-2xl font-bold mb-4">Clasificación</h2>
  <div id="clasificacion">Cargando clasificación…</div>
</section>

<!-- PARTIDOS -->
<section>
  <h2 class="text-2xl font-bold mb-4">Partidos</h2>
  <div id="partidos">Cargando partidos…</div>
</section>

</main>

<script>
/* =========================
   CONFIGURACIÓN
========================= */
const API_KEY = "a4c520820f7d99f2b0037dc66a19da932739db6a16cf6fffc75dc31978b9a096";
const RACING_ID = 728; // Racing Club Ferrol en api-football
const LEAGUE_ID = 435; // Primera Federación
const SEASON = 2024;

/* =========================
   NOTICIAS (RSS)
========================= */
const FEEDS = [
  "https://www.ferrol360.es/feed/",
  "https://www.lavozdegalicia.es/rss/ferrol.xml",
  "https://e00-marca.uecdn.es/rss/futbol/primera-rfef.xml"
];

const KEYWORDS = ["Racing de Ferrol","Racing Club Ferrol","Racing Ferrol"];

async function loadNews() {
  const box = document.getElementById("noticias");
  box.innerHTML = "";

  let items = [];

  for (const feed of FEEDS) {
    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed)}`);
    const data = await res.json();
    items = items.concat(data.items || []);
  }

  items = items.filter(i =>
    KEYWORDS.some(k =>
      (i.title||"").includes(k) || (i.description||"").includes(k)
    )
  );

  items.sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate));

  items.slice(0,10).forEach(n => {
    const img = n.enclosure?.link || n.thumbnail ||
      "https://upload.wikimedia.org/wikipedia/commons/0/0f/Racing_Club_Ferrol_logo.svg";

    box.innerHTML += `
      <div class="tarjeta destacado">
        <img src="${img}">
        <div class="info">
          <a href="${n.link}" target="_blank">${n.title}</a>
          <p>${new Date(n.pubDate).toLocaleDateString()}</p>
        </div>
      </div>`;
  });
}

/* =========================
   CLASIFICACIÓN
========================= */
async function loadClasificacion() {
  const box = document.getElementById("clasificacion");
  box.innerHTML = "";

  const res = await fetch(
    `https://v3.football.api-sports.io/standings?league=${LEAGUE_ID}&season=${SEASON}`,
    { headers:{ "x-apisports-key": API_KEY } }
  );
  const data = await res.json();
  const table = data.response[0].league.standings[0];

  table.forEach(t => {
    const racing = t.team.id === RACING_ID;
    box.innerHTML += `
      <div class="tarjeta ${racing?'destacado':''}">
        <img src="${t.team.logo}">
        <div class="info">
          <strong>${t.rank}. ${t.team.name}</strong>
          <p>${t.points} pts · DG ${t.goalsDiff}</p>
        </div>
      </div>`;
  });
}

/* =========================
   PARTIDOS
========================= */
async function loadPartidos() {
  const box = document.getElementById("partidos");
  box.innerHTML = "";

  const res = await fetch(
    `https://v3.football.api-sports.io/fixtures?team=${RACING_ID}&season=${SEASON}`,
    { headers:{ "x-apisports-key": API_KEY } }
  );
  const data = await res.json();

  data.response.slice(0,5).forEach(m => {
    box.innerHTML += `
      <div class="tarjeta destacado">
        <img src="${m.teams.home.logo}">
        <div class="info">
          <strong>${m.teams.home.name} ${m.goals.home ?? "-"} – ${m.goals.away ?? "-"} ${m.teams.away.name}</strong>
          <p>${new Date(m.fixture.date).toLocaleString()}</p>
        </div>
      </div>`;
  });
}

/* =========================
   INIT
========================= */
loadNews();
loadClasificacion();
loadPartidos();

setInterval(loadNews,30000);
setInterval(loadClasificacion,60000);
setInterval(loadPartidos,60000);
</script>

</body>
</html>
