<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Club Ferrol - Estilo Marca</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: system-ui, -apple-system, sans-serif; background:#f5f5f5; color:#111; }
.resaltado { color:#00AA00; font-weight:bold; }
.partido, .noticia { padding:12px; margin-bottom:12px; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
.partido { background:#ffffff; }
.noticia { background:#ffffff; border:1px solid #ddd; }
table { width:100%; border-collapse: collapse; }
th, td { padding:8px; text-align:left; border-bottom:1px solid #ddd; }
th { background:#eee; }
</style>
</head>
<body class="min-h-screen">

<!-- HEADER -->
<header class="bg-white py-6 shadow">
  <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Racing_Club_Ferrol_logo.svg/512px-Racing_Club_Ferrol_logo.svg.png" alt="Escudo Racing" class="h-16 w-16">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-gray-900">RACING CLUB FERROL</h1>
        <p class="text-gray-600 text-sm">Primera Federación • Todo en uno automático</p>
      </div>
    </div>
    <div class="text-right text-xs text-gray-600">
      Actualiza automáticamente cada 30s<br>
      <span class="resaltado">● EN VIVO</span>
    </div>
  </div>
</header>

<div class="max-w-6xl mx-auto px-4 py-8 space-y-12">

  <!-- NOTICIAS -->
  <section>
    <h2 class="text-2xl font-bold mb-4">Noticias Racing</h2>
    <div id="noticias"></div>
  </section>

  <!-- CLASIFICACIÓN -->
  <section>
    <h2 class="text-2xl font-bold mb-4">Clasificación Primera Federación - Grupo 1</h2>
    <table id="clasificacion"></table>
  </section>

  <!-- RESULTADOS EN VIVO -->
  <section>
    <h2 class="text-2xl font-bold mb-4">Marcador en directo y próximos partidos</h2>
    <div id="partidos"></div>
  </section>

</div>

<!-- FOOTER -->
<footer class="bg-white/50 py-6 text-center text-sm text-gray-600">
  <p>Web creada por nosotros • Hala Racing! 💙⚪</p>
</footer>

<script>
// Cambia por tu backend que devuelve JSON de clasificación y partidos
const BACKEND = "https://tu-proyecto.vercel.app";

async function fetchFootball(){
  try {
    const res = await fetch(`${BACKEND}/api/football`);
    return await res.json();
  } catch(e){
    console.error("Error fetch football:", e);
    return {standings:[], live:[]};
  }
}

async function fetchNews(){
  try {
    const res = await fetch(`${BACKEND}/api/news`);
    return await res.json();
  } catch(e){
    console.error("Error fetch news:", e);
    return [];
  }
}

async function loadAll(){
  const fb = await fetchFootball();
  const news = await fetchNews();

  // Clasificación
  const table = document.getElementById("clasificacion");
  table.innerHTML = "<tr><th>Pos</th><th>Equipo</th><th>Puntos</th></tr>";
  fb.standings.forEach((team,i)=>{
    const clase = /racing/i.test(team.team.name) ? "resaltado" : "";
    table.innerHTML += `<tr class="${clase}"><td>${i+1}</td><td>${team.team.name}</td><td>${team.points}</td></tr>`;
  });

  // Partidos
  const partidosDiv = document.getElementById("partidos");
  partidosDiv.innerHTML = "";
  if(fb.live.length===0){
    partidosDiv.innerText = "No hay partidos en vivo";
  } else {
    fb.live.forEach(game=>{
      const h = game.teams.home.name;
      const a = game.teams.away.name;
      const gh = game.goals.home;
      const ga = game.goals.away;
      const clase = /racing/i.test(h+a) ? "resaltado" : "";
      partidosDiv.innerHTML += `<div class="partido ${clase}">${h} ${gh} - ${ga} ${a}</div>`;
    });
  }

  // Noticias
  const noticiasDiv = document.getElementById("noticias");
  noticiasDiv.innerHTML = "";
  news.forEach(n=>{
    noticiasDiv.innerHTML += `<div class="noticia"><a href="${n.link}" target="_blank" class="text-gray-900 font-semibold">${n.title}</a></div>`;
  });
}

// Carga inicial y actualización cada 30s
loadAll();
setInterval(loadAll, 30000);
</script>

</body>
</html>
