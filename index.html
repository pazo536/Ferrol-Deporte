<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferrol Deporte - Racing en Vivo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: system-ui, -apple-system, sans-serif; background:#0A1F3D; color:white; }
.resaltado { color: #00FF7F; font-weight: bold; }
.partido, .noticia { padding:8px; margin-bottom:8px; border-radius:6px; }
.partido { background:#0f6b4a; color:white; }
.noticia { border:1px solid #ccc; background:#112B4F; }
</style>
</head>
<body class="min-h-screen">

<!-- HEADER -->
<header class="bg-gradient-to-r from-[#0A2B5E] to-[#003087] py-6 sticky top-0 z-50 shadow-xl">
  <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Racing_Club_Ferrol_logo.svg/512px-Racing_Club_Ferrol_logo.svg.png" alt="Escudo Racing" class="h-16 w-16">
      <div>
        <h1 class="text-4xl font-black tracking-tighter">RACING CLUB FERROL</h1>
        <p class="text-blue-300 text-sm">Primera Federación • Todo en uno automático</p>
      </div>
    </div>
    <div class="text-right text-xs text-blue-300">
      Actualiza automáticamente cada 30s<br>
      <span class="text-emerald-400">● EN VIVO</span>
    </div>
  </div>
</header>

<div class="max-w-6xl mx-auto px-4 py-8 space-y-12">

  <!-- NOTICIAS -->
  <section>
    <h2 class="text-3xl font-bold mb-4">Noticias Racing</h2>
    <div id="noticias"></div>
  </section>

  <!-- CLASIFICACIÓN -->
  <section>
    <h2 class="text-3xl font-bold mb-4">Clasificación Primera Federación - Grupo 1</h2>
    <table id="clasificacion" class="w-full border-separate border-spacing-2"></table>
  </section>

  <!-- RESULTADOS EN VIVO -->
  <section>
    <h2 class="text-3xl font-bold mb-4">Marcador en directo y próximos partidos</h2>
    <div id="partidos"></div>
  </section>

</div>

<!-- FOOTER -->
<footer class="bg-black/50 py-8 text-center text-sm text-gray-400">
  <p>Web creada por Grok para ti • Hala Racing! 💙⚪</p>
</footer>

<script>
// Cambia esto por tu backend o feeds válidos
const BACKEND = "https://tu-proyecto.vercel.app"; 

async function fetchFootball(){
  try {
    const res = await fetch(`${BACKEND}/api/football`);
    return await res.json();
  } catch(e){
    console.error("Error fetch football:", e);
    return {standings:[], live:[]};
  }
}

async function fetchNews(){
  try {
    const res = await fetch(`${BACKEND}/api/news`);
    return await res.json();
  } catch(e){
    console.error("Error fetch news:", e);
    return [];
  }
}

async function loadAll(){
  const fb = await fetchFootball();
  const news = await fetchNews();

  // Clasificación
  const table = document.getElementById("clasificacion");
  table.innerHTML = "<tr><th>Pos</th><th>Equipo</th><th>Puntos</th></tr>";
  fb.standings.forEach((team,i)=>{
    const clase = /racing/i.test(team.team.name) ? "resaltado" : "";
    table.innerHTML += `<tr class="${clase}"><td>${i+1}</td><td>${team.team.name}</td><td>${team.points}</td></tr>`;
  });

  // Partidos
  const partidosDiv = document.getElementById("partidos");
  partidosDiv.innerHTML = "";
  if(fb.live.length===0){
    partidosDiv.innerText = "No hay partidos en vivo";
  } else {
    fb.live.forEach(game=>{
      const h = game.teams.home.name;
      const a = game.teams.away.name;
      const gh = game.goals.home;
      const ga = game.goals.away;
      const clase = /racing/i.test(h+a) ? "resaltado" : "";
      partidosDiv.innerHTML += `<div class="partido ${clase}">${h} ${gh} - ${ga} ${a}</div>`;
    });
  }

  // Noticias
  const noticiasDiv = document.getElementById("noticias");
  noticiasDiv.innerHTML = "";
  news.forEach(n=>{
    noticiasDiv.innerHTML += `<div class="noticia"><a href="${n.link}" target="_blank" class="text-white">${n.title}</a></div>`;
  });
}

// Carga inicial y actualización cada 30s
loadAll();
setInterval(loadAll, 30000);
</script>

</body>
</html>
