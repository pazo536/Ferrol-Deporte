<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticias Racing - Creativo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: system-ui, -apple-system, sans-serif; background:#f5f5f5; color:#111; margin:0; }

header {
  position: relative;
  background: linear-gradient(135deg,#001F3D,#003087);
  padding: 40px 20px;
  overflow: hidden;
  text-align:center;
}

header h1 {
  font-family: "Impact", "Arial Black", sans-serif;
  text-transform: uppercase;
  display: inline-block;
  position: relative;
}

.marca-n {
  font-size:5rem;
  color:white;
  -webkit-text-stroke:3px #004500;
  font-weight:900;
  animation: shine 2s infinite linear;
}

.marca-resto {
  font-size:2.5rem;
  color:white;
  -webkit-text-stroke:2px #004500;
  font-weight:800;
  margin-left:5px;
  animation: fadeIn 2s ease forwards;
}

@keyframes shine {
  0%{text-shadow:0 0 5px #fff,0 0 10px #fff,0 0 20px #0f0,0 0 30px #0f0,0 0 40px #0f0;}
  50%{text-shadow:0 0 10px #fff,0 0 20px #0f0,0 0 30px #0f0,0 0 40px #0f0,0 0 50px #0f0;}
  100%{text-shadow:0 0 5px #fff,0 0 10px #fff,0 0 20px #0f0,0 0 30px #0f0,0 0 40px #0f0;}
}

@keyframes fadeIn {
  from {opacity:0; transform:translateX(-20px);}
  to {opacity:1; transform:translateX(0);}
}

/* Noticias */
.noticia {
  background:#fff;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  padding:12px;
  margin-bottom:12px;
  display:flex;
  gap:16px;
  align-items:flex-start;
  transition: transform 0.2s;
}
.noticia:hover { transform: translateY(-2px); }
.noticia img { width:160px; height:90px; object-fit:cover; border-radius:6px; flex-shrink:0; }

/* Fechas y títulos */
.noticia a { font-weight:bold; color:#111; text-decoration:none; }
.noticia p { color:#555; font-size:0.85rem; margin-top:4px; }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <h1>
    <span class="marca-n">N</span><span class="marca-resto">oticias Racing</span>
  </h1>
</header>

<div class="max-w-6xl mx-auto px-4 py-8">

  <!-- NOTICIAS -->
  <section>
    <h2 class="text-2xl font-bold mb-4">Últimas noticias del Racing</h2>
    <div id="noticias">Cargando noticias...</div>
  </section>

</div>

<script>
// RSS y fallback seguro para imágenes
const RSS_URL = "https://news.google.com/rss/search?q=%22Racing+de+Ferrol%22+OR+%22Racing+Club+Ferrol%22&hl=es-ES&gl=ES&ceid=ES:es";
const RSS2JSON = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(RSS_URL);

async function loadNews(){
  try {
    const res = await fetch(RSS2JSON);
    const data = await res.json();
    const noticiasDiv = document.getElementById("noticias");
    noticiasDiv.innerHTML = "";
    data.items.forEach(item => {
      const imgSrc = item.enclosure?.link 
                     || item.thumbnail 
                     || "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Racing_Club_Ferrol_logo.svg/512px-Racing_Club_Ferrol_logo.svg.png";
      noticiasDiv.innerHTML += `
        <div class="noticia">
          <img src="${imgSrc}" alt="Noticia Racing">
          <div>
            <a href="${item.link}" target="_blank">${item.title}</a>
            <p>${item.pubDate ? new Date(item.pubDate).toLocaleDateString() : ''}</p>
          </div>
        </div>
      `;
    });
  } catch(e){
    console.error("Error cargando noticias:", e);
    document.getElementById("noticias").innerText = "No se pudieron cargar las noticias.";
  }
}

// Carga inicial y actualización cada 30s
loadNews();
setInterval(loadNews, 30000);
</script>

</body>
</html>
