<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ferrol Deporte</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}
header{background:#1f7a1f;color:#fff;text-align:center;padding:16px}
.logo{font-size:34px;font-weight:900;letter-spacing:2px}
.main{display:flex;gap:16px;padding:16px;max-width:1200px;margin:auto}
.sidebar{width:260px}
.sidebar h2{border-bottom:2px solid #1f7a1f;padding-bottom:6px}
.sidebar ol{padding-left:18px}
.sidebar li{margin:6px 0;font-size:14px;color:#444}
.sidebar li.racing{font-weight:700;color:#1f7a1f;font-size:15px}
.content{flex:1}
article{border-bottom:1px solid #ddd;padding:12px 0}
article img{width:100%;max-height:200px;object-fit:cover;border-radius:6px}
article h3{margin:8px 0 6px;font-size:18px}
article p{margin:0;color:#555}
.medio{font-size:12px;color:#777;margin-top:6px;display:flex;align-items:center;gap:6px}
.medio img{width:18px;height:18px}
footer{text-align:center;font-size:12px;color:#777;padding:16px}
@media(max-width:768px){
  .main{flex-direction:column}
  .sidebar{width:100%}
}
</style>
</head>

<body>

<header>
  <div class="logo">FERROL DEPORTE</div>
</header>

<div class="main">

  <!-- CLASIFICACIÓN -->
  <aside class="sidebar">
    <h2>Clasificación</h2>
    <ol>
      <li>1. Leganés</li>
      <li>2. Valladolid</li>
      <li>3. Eibar</li>
      <li class="racing">4. Racing de Ferrol</li>
      <li>5. Espanyol</li>
      <li>6. Levante</li>
      <li>7. Oviedo</li>
      <li>8. Tenerife</li>
      <li>9. Elche</li>
      <li>10. Burgos</li>
    </ol>
  </aside>

  <!-- NOTICIAS -->
  <section class="content" id="noticias">
    <p>Cargando noticias…</p>
  </section>

</div>

<footer>
  © Ferrol Deporte
</footer>

<script>
const apiKey = "7946d32466614bd6872927ca4c3b1661";
const url = `https://newsapi.org/v2/everything?q="Racing de Ferrol"&language=es&sortBy=publishedAt&pageSize=5&apiKey=${apiKey}`;
const proxy = "https://api.allorigins.win/get?url=" + encodeURIComponent(url);

fetch(proxy)
.then(res => res.json())
.then(data => {
  const noticias = JSON.parse(data.contents).articles;
  const contenedor = document.getElementById("noticias");
  contenedor.innerHTML = "";

  noticias.forEach(n => {
    const texto = (n.title + n.description).toLowerCase();
    if(!texto.includes("racing de ferrol")) return;

    const dominio = n.url ? new URL(n.url).hostname : "";
    const logo = dominio ? `https://logo.clearbit.com/${dominio}` : "";

    contenedor.innerHTML += `
      <article>
        ${n.urlToImage ? `<img src="${n.urlToImage}">` : ""}
        <h3>${n.title}</h3>
        <p>${n.description || ""}</p>
        <div class="medio">
          ${logo ? `<img src="${logo}">` : ""}
          ${n.source.name}
        </div>
      </article>
    `;
  });
})
.catch(() => {
  document.getElementById("noticias").innerHTML = "No se pudieron cargar las noticias.";
});
</script>

</body>
</html>
